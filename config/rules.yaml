rules:
  # Пример: сообщение должно содержать И "срочно", И "платеж"
  - words: ["срочно", "платеж"]
    operator: AND

  # Пример: сообщение должно содержать И "инцидент", И "сервер"
  - words: ["инцидент", "сервер"]
    operator: AND

  # Простое OR: любое из слов
  - words: ["alert", "critical"]
    operator: OR